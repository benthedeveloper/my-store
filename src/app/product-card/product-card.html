@let p = product();

<div class="product-card">
  <div class="product-image-wrapper">
    <img [ngSrc]="p.thumbnail" [alt]="p.title" width="260" height="260" priority />
  </div>

  <div class="product-info">
    <a [routerLink]="['/products', p.id]" class="product-title">{{ p.title }}</a>
    <p class="product-price">${{ p.price.toFixed(2) }}</p>

    <div class="product-actions">
      <button class="btn btn-primary" (click)="onAddToCart($event)">Add to Cart</button>
      <a [routerLink]="['/products', p.id]" class="btn btn-outline"> Details </a>
    </div>
  </div>
</div>
